[project]
name = "moveo-food-agent"
version = "0.1.0"
description = "Agentic food ordering system with MCP integration and voice support"
authors = [{ name = "Candidate" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
